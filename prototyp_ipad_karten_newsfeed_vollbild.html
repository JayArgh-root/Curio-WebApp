<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>iPad-Prototyp — News Feed (gemischter Strom)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,ital@9..144,340..600,0..1&family=Libre+Franklin:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink: #12213A;
    --ink-deep: #0A1524;
    --parchment: #F3EAD8;
    --parchment-edge: #E3D5B7;
    --brass: #B8925A;
    --brass-bright: #D3A868;
    --charcoal: #241F18;
    --charcoal-soft: #6B6152;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%;
    background: var(--ink);
    font-family: 'Libre Franklin', sans-serif;
    overflow: hidden;
  }

  /* iPad Mini 5. Generation, Portrait — Home-Button, dickere Bezel, kein Notch */

  .screen {
    position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; background: var(--ink);
    overflow: hidden; display: flex; flex-direction: column;
  }

  .statusbar {
    height: 46px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between;
    padding: 0 28px; color: rgba(240, 233, 216, 0.82); font-size: 14px; font-weight: 600; letter-spacing: 0.02em;
  }

  .card-list { flex: 1; overflow-y: auto; padding: 20px 28px 28px 28px; display: flex; flex-direction: column; gap: 18px; }

  /* Option D: Karte im Querformat, Bild links, Text rechts */
  .card {
    position: relative; flex: 0 0 376px; display: flex; flex-direction: row; background: var(--parchment);
    border-radius: 20px; overflow: hidden; cursor: pointer;
    box-shadow: 0 18px 34px -16px rgba(0,0,0,0.5), 0 2px 0 rgba(255,255,255,0.4) inset;
  }
  .card .media { position: relative; width: 40%; flex-shrink: 0; overflow: hidden; }
  .card .media svg { width: 100%; height: 100%; display: block; }
  .card .media img.hero-img, .sheet-hero img.hero-img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .card .lat-ticks {
    position: absolute; top: 12px; left: 0; right: 0; height: 16px;
    display: flex; justify-content: space-between; padding: 0 16px; opacity: 0.55;
  }
  .card .lat-ticks span { width: 1px; height: 100%; background: rgba(243, 234, 216, 0.55); }
  .card .lat-ticks span:nth-child(4n) { background: rgba(243,234,216,0.85); }
  .card .media-gradient {
    position: absolute; inset: 0;
    background: linear-gradient(90deg, rgba(18,33,58,0) 55%, rgba(18,33,58,0.28) 100%);
  }
  .card .seal {
    position: absolute; right: -20px; top: 24px; width: 60px; height: 60px; border-radius: 50%;
    background: var(--parchment); border: 1.5px solid var(--brass);
    box-shadow: 0 8px 16px -6px rgba(0,0,0,0.4); display: flex; align-items: center; justify-content: center; z-index: 5;
  }
  .card .seal svg { width: 30px; height: 30px; }

  .card .body { flex: 1; display: flex; flex-direction: column; justify-content: flex-start; padding: 28px 32px; min-width: 0; }
  .card .eyebrow { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
  .card .eyebrow-cat { font-size: 13px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--brass); }
  .card .eyebrow-source { font-size: 13px; font-weight: 500; color: var(--charcoal-soft); letter-spacing: 0.01em; }
  .card .eyebrow-source .source-name { font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em; color: var(--charcoal-soft); }
  .card .eyebrow-source .colon { margin-right: 3px; }
  .card .headline {
    font-family: 'Fraunces', serif; font-optical-sizing: auto; font-weight: 460;
    font-size: 19px; line-height: 1.4; color: var(--charcoal); letter-spacing: -0.002em; margin: 0;
  }
  .card .headline em { font-style: italic; font-weight: 500; color: #3a2f22; }

  .scroll-hint {
    flex-shrink: 0; text-align: center; font-size: 11px; color: rgba(230, 220, 200, 0.35);
    letter-spacing: 0.04em; padding-bottom: 6px;
  }

  /* ---------- Übersichtsseite (Overlay über card-list) ---------- */
  .overview-overlay {
    position: absolute; inset: 0; z-index: 90; background: var(--ink);
    display: flex; flex-direction: column; opacity: 1; pointer-events: auto;
    transition: opacity 0.3s ease;
  }
  .overview-overlay.hidden { opacity: 0; pointer-events: none; }

  .ov-content { flex: 1; overflow-y: auto; padding: 24px; }
  .ov-hero-row { display: flex; gap: 16px; margin-bottom: 16px; }
  .ov-hero-tile {
    flex: 1; aspect-ratio: 1 / 1; border-radius: 22px; position: relative; overflow: hidden;
    display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center;
    background: var(--parchment) center/cover no-repeat; box-shadow: 0 18px 34px -16px rgba(0,0,0,0.5), 0 2px 0 rgba(255,255,255,0.4) inset;
    cursor: pointer;
  }
  .ov-hero-tile.has-img { background-color: var(--ink); }
  .ov-hero-tile .tile-gradient { position: absolute; inset: 0; background: rgba(10, 21, 36, 0.55); pointer-events: none; }
  .ov-hero-tile .icon, .ov-hero-tile .title, .ov-hero-tile .subtitle, .ov-hero-tile .badge { position: relative; z-index: 1; }
  .ov-hero-tile.has-img .title, .ov-hero-tile.has-img .subtitle { color: var(--parchment); }
  .ov-hero-tile .icon { width: 54px; height: 54px; margin-bottom: 16px; }
  .ov-hero-tile .title { font-family: 'Fraunces', serif; font-weight: 520; font-size: 25px; color: var(--charcoal); margin: 0 0 8px 0; }
  .ov-hero-tile .subtitle { font-size: 14px; color: var(--charcoal-soft); max-width: 260px; line-height: 1.4; margin: 0; }
  .ov-hero-tile .badge {
    position: absolute; top: 18px; right: 18px; font-size: 10.5px; font-weight: 700; letter-spacing: 0.06em;
    text-transform: uppercase; color: var(--brass); background: rgba(184,146,90,0.14); padding: 5px 11px; border-radius: 20px;
  }
  .ov-category-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }
  .ov-category-tile {
    aspect-ratio: 1 / 1; border-radius: 20px; background: var(--parchment) center/cover no-repeat;
    box-shadow: 0 14px 26px -14px rgba(0,0,0,0.45), 0 2px 0 rgba(255,255,255,0.4) inset;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 12px;
    padding-bottom: 18px; cursor: pointer; position: relative; overflow: hidden;
  }
  .ov-category-tile.has-img { background-color: var(--ink); }
  .ov-category-tile .tile-gradient {
    position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(10,21,36,0.15) 0%, rgba(10,21,36,0.72) 100%);
    pointer-events: none;
  }
  .ov-category-tile .icon-badge, .ov-category-tile .cat-name { position: relative; z-index: 1; }
  .ov-category-tile.has-img .icon-badge { background: rgba(243, 234, 216, 0.75); border: 1px solid rgba(184, 146, 90, 0.5); }
  .ov-category-tile.has-img .cat-name { color: var(--parchment); }
  .ov-category-tile .icon-badge {
    width: 54px; height: 54px; border-radius: 50%; background: rgba(184,146,90,0.1);
    display: flex; align-items: center; justify-content: center;
  }
  .ov-category-tile .icon-badge svg { width: 30px; height: 30px; }
  .ov-category-tile .cat-name { font-size: 15px; font-weight: 600; color: var(--charcoal); text-align: center; letter-spacing: 0.01em; }
  .ov-section-label {
    color: rgba(230, 220, 200, 0.4); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase;
    font-weight: 600; margin: 4px 4px 12px 4px;
  }
  .ov-toast {
    position: absolute; left: 24px; right: 24px; bottom: 24px; z-index: 95;
    text-align: center; opacity: 0; transition: opacity 0.25s ease; pointer-events: none;
  }
  .ov-toast span {
    display: inline-block; font-size: 13px; color: #F3EAD8;
    background: rgba(10, 21, 36, 0.85); padding: 9px 18px; border-radius: 20px;
  }
  .overview-back-btn {
    position: absolute; top: 22px; left: 24px; z-index: 30; display: flex; align-items: center; justify-content: center;
    width: 38px; height: 38px; background: rgba(10, 21, 36, 0.55); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    border-radius: 50%; color: #F3EAD8; box-shadow: 0 4px 12px -4px rgba(0,0,0,0.6);
    cursor: pointer; border: none;
  }
  .overview-back-btn svg { width: 18px; height: 18px; }

  /* ---------- Sheet-Overlay (Zusammenfassung) ---------- */
  .sheet-overlay {
    position: absolute; inset: 0; background: rgba(10, 21, 36, 0.55);
    opacity: 0; pointer-events: none; transition: opacity 0.3s ease; z-index: 50;
  }
  .sheet-overlay.open { opacity: 1; pointer-events: auto; }

  .sheet {
    position: absolute; left: 0; right: 0; bottom: 0; height: 100%;
    background: var(--parchment); border-radius: 0;
    display: flex; flex-direction: column; overflow: hidden;
    transform: translateY(100%); transition: transform 0.32s cubic-bezier(.22,.85,.32,1);
  }
  .sheet-overlay.open .sheet { transform: translateY(0); }

  .sheet-handle { display: none; }

  .sheet-hero { position: relative; width: 100%; flex: 0 0 32%; overflow: hidden; flex-shrink: 0; }
  .sheet-hero svg { width: 100%; height: 100%; display: block; }
  .sheet-hero-gradient {
    position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(10,21,36,0.3) 0%, rgba(10,21,36,0.05) 30%, rgba(243,234,216,0) 60%, var(--parchment) 100%);
  }
  .sheet-close-btn {
    position: absolute; top: 18px; right: 18px; z-index: 10; display: flex; align-items: center; justify-content: center;
    width: 38px; height: 38px; background: rgba(10, 21, 36, 0.42); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    border-radius: 50%; color: #F3EAD8; cursor: pointer; border: none;
  }
  .sheet-close-btn svg { width: 17px; height: 17px; }

  .sheet-reading { flex: 1; overflow-y: auto; padding: 22px 48px 0 48px; max-width: 640px; }
  .sheet-eyebrow { display: flex; flex-direction: column; gap: 6px; margin-bottom: 18px; }
  .sheet-eyebrow-cat { font-size: 13px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--brass); }
  .sheet-eyebrow-source { font-size: 13px; font-weight: 500; color: var(--charcoal-soft); letter-spacing: 0.01em; }
  .sheet-eyebrow-source .source-name { font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em; color: var(--charcoal-soft); }
  .sheet-eyebrow-source .colon { margin-right: 3px; }
  .sheet-lead {
    font-family: 'Fraunces', serif; font-optical-sizing: auto; font-weight: 520;
    font-size: 21px; line-height: 1.42; color: var(--charcoal); letter-spacing: -0.003em; margin: 0 0 16px 0;
  }
  .sheet-summary-body { font-size: 16px; line-height: 1.66; color: #3A3327; margin: 0 0 22px 0; }

  .sheet-actions {
    flex-shrink: 0; padding: 16px 48px 26px 48px; background: var(--parchment); border-top: 1px solid var(--parchment-edge);
    display: flex; gap: 14px; position: relative;
  }
  .sheet-actions-inner { max-width: 640px; width: 100%; display: flex; gap: 14px; margin: 0 auto; }
  .sheet-cta {
    flex: 1; width: auto; background: var(--ink); color: var(--parchment); border: none; border-radius: 14px;
    padding: 16px 18px; font-family: 'Libre Franklin', sans-serif; font-size: 14.5px; font-weight: 600;
    letter-spacing: 0.01em; display: flex; align-items: center; justify-content: center; gap: 7px; cursor: pointer;
  }
  .sheet-cta svg { width: 15px; height: 15px; flex-shrink: 0; }
  .sheet-cta.disabled { opacity: 0.4; cursor: not-allowed; }

  .md-toast {
    position: absolute; left: 48px; right: 48px; bottom: 100%; margin-bottom: 8px; z-index: 5;
    text-align: center; opacity: 0; transition: opacity 0.25s ease; pointer-events: none;
  }
  .md-toast span {
    display: inline-block; font-size: 12.5px; color: #F3EAD8;
    background: rgba(10, 21, 36, 0.85); padding: 7px 15px; border-radius: 20px;
  }

  /* ---------- Feedback: Daumen hoch/runter + Kommentar ---------- */
  .feedback-cluster { position: absolute; right: 10px; bottom: 10px; z-index: 25; display: flex; gap: 5px; }
  .fb-btn {
    display: flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; border-radius: 50%;
    background: rgba(10, 21, 36, 0.42); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    border: none; color: #F3EAD8; cursor: pointer; transition: background 0.15s ease, color 0.15s ease;
  }
  .fb-btn svg { width: 13px; height: 13px; }
  .fb-btn.active { background: var(--brass); color: var(--ink); }
  .fb-btn.active svg path { fill: currentColor; }

  .fb-scope-popup {
    position: absolute; z-index: 60; display: none; gap: 5px;
    background: rgba(10, 21, 36, 0.9); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    padding: 7px; border-radius: 12px;
  }
  .fb-scope-popup button {
    border: none; background: rgba(255,255,255,0.08); color: #F3EAD8;
    font-family: 'Libre Franklin', sans-serif; font-size: 12px; font-weight: 600;
    padding: 7px 11px; border-radius: 8px; cursor: pointer; white-space: nowrap;
  }
  .fb-scope-popup button:hover { background: var(--brass); color: var(--ink); }

  .fb-toast {
    position: absolute; left: 10px; right: 10px; bottom: 46px; z-index: 24;
    text-align: center; opacity: 0; transition: opacity 0.25s ease; pointer-events: none;
  }
  .fb-toast span {
    display: inline-block; font-size: 12px; color: #F3EAD8;
    background: rgba(10, 21, 36, 0.78); padding: 6px 13px; border-radius: 20px;
  }

  .fb-comment-panel {
    display: none; margin: 0 0 20px 0; padding: 14px; border-radius: 14px;
    background: rgba(184, 146, 90, 0.08); border: 1px solid var(--parchment-edge);
  }
  .fb-comment-panel textarea {
    width: 100%; min-height: 70px; resize: vertical; border: none; background: transparent;
    font-family: 'Libre Franklin', sans-serif; font-size: 14px; color: var(--charcoal); outline: none;
  }
  .fb-comment-panel .fb-send {
    margin-top: 8px; border: none; background: var(--ink); color: var(--parchment);
    font-size: 13px; font-weight: 600; padding: 8px 16px; border-radius: 10px; cursor: pointer;
  }

  /* ---------- Volltext: eigenes Sheet über die volle Bildschirmgröße ---------- */
  .fulltext-sheet {
    position: absolute; inset: 0; background: var(--parchment); z-index: 70;
    display: flex; flex-direction: column;
    transform: translateY(100%); transition: transform 0.32s cubic-bezier(.22,.85,.32,1);
  }
  .fulltext-sheet.open { transform: translateY(0); }

  .ft-header {
    flex-shrink: 0; display: flex; align-items: center; justify-content: space-between;
    padding: 22px 32px 14px 32px; color: var(--charcoal-soft); font-size: 14px; font-weight: 600;
  }
  .ft-header-back, .ft-close {
    display: flex; align-items: center; justify-content: center; width: 36px; height: 36px; border-radius: 50%;
    background: rgba(36,31,24,0.06); color: var(--charcoal-soft); cursor: pointer; flex-shrink: 0; border: none;
  }
  .ft-header-back svg { width: 17px; height: 17px; }
  .ft-close svg { width: 16px; height: 16px; }

  .ft-reading { flex: 1; overflow-y: auto; padding: 0 48px 40px 48px; }
  .ft-reading-inner { max-width: 640px; }
  .ft-badge {
    display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--brass); background: rgba(184,146,90,0.14); padding: 6px 13px; border-radius: 20px; margin-bottom: 18px;
  }
  .ft-title { font-family: 'Fraunces', serif; font-weight: 560; font-size: 28px; line-height: 1.28; color: var(--charcoal); margin: 0 0 12px 0; }
  .ft-source-meta { font-size: 13px; font-weight: 500; color: var(--charcoal-soft); letter-spacing: 0.01em; margin: 0 0 26px 0; }
  .ft-source-meta .source-name { font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em; color: var(--charcoal-soft); }
  .ft-source-meta .colon { margin-right: 3px; }
  .ft-source-meta .dot { margin: 0 6px; opacity: 0.55; }
  .ft-reading p { font-size: 16px; line-height: 1.72; color: #3A3327; margin: 0 0 18px 0; }

  /* ---------- Ladezustand / Fehlerfall beim fetch()-Laden von articles.json (Schritt 3, Plan-Punkt 8.1) ---------- */
  .load-state, .load-error {
    position: absolute; inset: 0; z-index: 100;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 16px; background: var(--ink); color: var(--parchment);
    font-family: 'Libre Franklin', sans-serif; text-align: center; padding: 40px;
  }
  .load-spinner {
    width: 38px; height: 38px; border-radius: 50%;
    border: 3px solid rgba(243, 234, 216, 0.18); border-top-color: var(--brass-bright);
    animation: load-spin 0.85s linear infinite;
  }
  @keyframes load-spin { to { transform: rotate(360deg); } }
  .load-state p { margin: 0; font-size: 15px; color: var(--parchment-edge); }
  .load-error-title { font-family: 'Fraunces', serif; font-weight: 560; font-size: 22px; color: var(--parchment); margin: 0; }
  .load-error-text { font-size: 15px; color: var(--parchment-edge); margin: 0; max-width: 320px; line-height: 1.5; }
  .load-retry-btn {
    margin-top: 4px; padding: 11px 26px; border-radius: 999px; border: 1px solid var(--brass);
    background: transparent; color: var(--brass-bright); font-family: 'Libre Franklin', sans-serif;
    font-size: 15px; font-weight: 600; cursor: pointer;
  }
  .load-retry-btn:active { background: rgba(184, 146, 90, 0.15); }
</style>
</head>
<body>

<div class="screen">
        <button class="overview-back-btn" id="overviewBackBtn" title="Zurück zur Übersicht">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M15 18L9 12L15 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <div class="card-list" id="cardList"></div>
        <div class="sheet-overlay" id="sheetOverlay">
          <div class="sheet" id="sheet">
          <div class="sheet-handle"><span></span></div>
          <div class="sheet-hero" id="sheetHero">
            <div class="sheet-hero-gradient"></div>
            <button class="sheet-close-btn" id="sheetCloseBtn" title="Schließen">
              <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M6 6L18 18M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <div class="fb-toast" id="fbToast"><span id="fbToastText"></span></div>
            <div class="feedback-cluster" id="feedbackCluster">
              <button class="fb-btn" id="fbUp" title="Gefällt mir (kurz antippen) · Quelle/Thema wählen (gedrückt halten)">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3H14z"/><path d="M7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"/></svg>
              </button>
              <button class="fb-btn" id="fbDown" title="Gefällt mir nicht (kurz antippen) · Quelle/Thema wählen (gedrückt halten)">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 15v4a3 3 0 0 0 3 3l4-9V2H5.72a2 2 0 0 0-2 1.7l-1.38 9a2 2 0 0 0 2 2.3H10z"/><path d="M17 2h3a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2h-3"/></svg>
              </button>
              <button class="fb-btn" id="fbComment" title="Kommentar hinzufügen">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
              </button>
            </div>
          </div>
          <div class="sheet-reading" id="sheetReading"></div>
          <div class="fb-scope-popup" id="fbScopePopup">
            <button data-scope="source">Quelle</button>
            <button data-scope="topic">Thema</button>
            <button data-scope="both">Beides</button>
          </div>
          <div class="sheet-actions">
            <div class="md-toast" id="mdToast"><span id="mdToastText"></span></div>
            <div class="sheet-actions-inner">
              <button class="sheet-cta" id="btnMehrDetails" onclick="onMehrDetailsClick()">
                Mehr Details
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M5 12H19M19 12L13 6M19 12L13 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </button>
              <button class="sheet-cta" id="btnOriginal" onclick="onOriginalClick()">
                Original öffnen
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M7 17L17 7M17 7H8M17 7V16" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </button>
            </div>
          </div>
        </div>
        </div>
        <div class="fulltext-sheet" id="fulltextSheet">
          <div class="ft-header">

/* ---------- GitHub-API: gemeinsamer Lese/Schreib-Helper für feedback.json & articles.json (Schritt 3, Plan-Punkt 8.2) ---------- */
function githubConfigured() {
  return !!GITHUB_TOKEN && GITHUB_TOKEN !== 'HIER_EINFÜGEN' && !!GITHUB_OWNER && GITHUB_OWNER !== 'HIER_EINFÜGEN';
}

async function githubGetFile(path) {
  const url = `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${path}?ref=${GITHUB_BRANCH}`;
  const res = await fetch(url, { headers: { Authorization: `Bearer ${GITHUB_TOKEN}`, Accept: 'application/vnd.github+json' } });
  if (res.status === 404) return { sha: null, data: null };
  if (!res.ok) throw new Error('GitHub GET fehlgeschlagen: HTTP ' + res.status);
  const json = await res.json();
  const decoded = decodeURIComponent(escape(atob(json.content.replace(/\n/g, ''))));
  return { sha: json.sha, data: JSON.parse(decoded) };
}

async function githubPutFile(path, data, sha, message) {
  const url = `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${path}`;
  const content = btoa(unescape(encodeURIComponent(JSON.stringify(data, null, 2))));
  const body = { message, content, branch: GITHUB_BRANCH };
  if (sha) body.sha = sha;
  const res = await fetch(url, {
    method: 'PUT',
    headers: { Authorization: `Bearer ${GITHUB_TOKEN}`, Accept: 'application/vnd.github+json', 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });
  if (!res.ok) throw new Error('GitHub PUT fehlgeschlagen: HTTP ' + res.status + ' ' + (await res.text().catch(() => '')));
  return res.json();
}

/* Read-Modify-Write mit einem Retry bei Konflikt (z. B. sha veraltet, HTTP 409) — für den Einzelnutzer-Betrieb
   dieser App ausreichend robust, löst aber echte gleichzeitige Schreibzugriffe mehrerer Geräte nicht strukturell
   auf (siehe Sichtungs-Notiz zu diesem Cowork-Auftrag). Ohne konfigurierten Token wird der Schreibversuch
   übersprungen (Konsolen-Warnung), damit die App auch vor Token-Eintragung normal nutzbar bleibt. */
async function githubUpdateFile(path, mutateFn, message) {
  if (!githubConfigured()) {
    console.warn('[GitHub] Kein Token/Owner konfiguriert — Schreibvorgang übersprungen:', path);
    return false;
  }
  for (let attempt = 0; attempt < 2; attempt++) {
    try {
      const { sha, data } = await githubGetFile(path);
      const updated = mutateFn(data);
      await githubPutFile(path, updated, sha, message);
      return true;
    } catch (err) {
      console.error(`[GitHub] Schreibversuch ${attempt + 1} fehlgeschlagen für ${path}:`, err);
      if (attempt === 1) return false;
    }
  }
  return false;
}

/* Setzt gelesenAm beim ersten Öffnen der Zusammenfassung (Grundlage für das rollierende Zeitfenster,

    const arr = Array.isArray(data) ? data : [];
    const match = arr.find(x => x.id === article.id);
    if (match) match.gelesenAm = stamp;
    return arr;
  }, `Lesestatus: ${article.id} gelesen`).then((ok) => {
    if (!ok) console.warn('[GitHub] gelesenAm konnte nicht persistiert werden für', article.id);
  });

/* Rendert `mehrDetails` robust, egal ob die Cloud Routine einen einzelnen String (mit \n\n als
   Absatztrenner) oder ein Array von Absatz-Strings liefert — Format war zum Zeitpunkt dieser
   Umstellung anhand der Projektdateien nicht abschließend verifizierbar (siehe Rückmeldung an Jochen). */
function renderMehrDetailsParagraphs(a) {
  const md = a.mehrDetails;
  let paragraphs;
  if (Array.isArray(md)) {
    paragraphs = md;
  } else if (typeof md === 'string' && md.trim()) {
    paragraphs = md.split(/\n\s*\n/).map(p => p.trim()).filter(Boolean);
    if (paragraphs.length === 0) paragraphs = [md.trim()];
  } else {
    paragraphs = [];
  }
  return paragraphs.map(p => `<p>${p}</p>`).join('');
}

  const state = (art && feedbackState[art.id]) || {};
  const cUp = document.getElementById('fbUp-c' + index);
  const cDown = document.getElementById('fbDown-c' + index);
  const cComment = document.getElementById('fbComment-c' + index);
  if (cUp) cUp.classList.toggle('active', state.thumb === 'up');
  if (cDown) cDown.classList.toggle('active', state.thumb === 'down');
  if (cComment) cComment.classList.toggle('active', !!state.commentGiven);

  if (currentSheetIndex === index) {
    const sUp = document.getElementById('fbUp');
    const sDown = document.getElementById('fbDown');
    const sComment = document.getElementById('fbComment');
    if (sUp) sUp.classList.toggle('active', state.thumb === 'up');
    if (sDown) sDown.classList.toggle('active', state.thumb === 'down');
    if (sComment) sComment.classList.toggle('active', !!state.commentGiven);
  }
}

function showFbToast(toastId, textId, msg) {
  const toast = document.getElementById(toastId);
  const text = document.getElementById(textId);
  if (!toast || !text) return;
  text.textContent = msg;
  toast.style.opacity = '1';
  clearTimeout(toast._t);
  toast._t = setTimeout(() => { toast.style.opacity = '0'; }, 1800);
}

/* Sheet (immer dieselben IDs, wird bei jedem Öffnen neu aufgebaut) */
function initFeedback(index) {
  const art = articles[index];
  if (!feedbackState[art.id]) feedbackState[art.id] = { thumb: null, scope: null, commentGiven: false };
  const state = feedbackState[art.id];
  const up = document.getElementById('fbUp');
  const down = document.getElementById('fbDown');
  const commentBtn = document.getElementById('fbComment');
  const popup = document.getElementById('fbScopePopup');
  const panel = document.getElementById('fbCommentPanel');
  const input = document.getElementById('fbCommentInput');
  const sendBtn = document.getElementById('fbCommentSend');

  refreshFeedbackIcon(index);

  let pressTimer = null, longPressed = false;

  function startPress(thumbType) {
    longPressed = false;
    pressTimer = setTimeout(() => { longPressed = true; openScopePopup(thumbType); }, 450);
  }
  function endPress(thumbType) {
    clearTimeout(pressTimer);
    if (longPressed) return;
    if (state.thumb === thumbType) { state.thumb = null; state.scope = null; }
    else {
      state.thumb = thumbType; state.scope = 'both';
      showFbToast('fbToast', 'fbToastText', 'Feedback gespeichert · Quelle & Thema');
      logFeedback({ timestamp: new Date().toISOString(), type: 'thumb', articleId: art.id, category: art.category, source: art.source, bezug: 'beides', richtung: richtungLabel(thumbType) }, { toastId: 'fbToast', textId: 'fbToastText' });
    }
    refreshFeedbackIcon(index);
  }
  function openScopePopup(thumbType) {
    const btn = thumbType === 'up' ? up : down;
    const sheetRect = document.getElementById('sheet').getBoundingClientRect();
    const btnRect = btn.getBoundingClientRect();
    popup.style.display = 'flex';
    popup.dataset.pendingThumb = thumbType;
    popup.style.right = (sheetRect.right - btnRect.right) + 'px';
    popup.style.bottom = (sheetRect.bottom - btnRect.top + 8) + 'px';
  }

  up.addEventListener('pointerdown', (e) => { e.stopPropagation(); startPress('up'); });
  up.addEventListener('pointerup', (e) => { e.stopPropagation(); endPress('up'); });
  up.addEventListener('pointerleave', () => clearTimeout(pressTimer));
  up.addEventListener('click', (e) => e.stopPropagation());
  down.addEventListener('pointerdown', (e) => { e.stopPropagation(); startPress('down'); });
  down.addEventListener('pointerup', (e) => { e.stopPropagation(); endPress('down'); });
  down.addEventListener('pointerleave', () => clearTimeout(pressTimer));
  down.addEventListener('click', (e) => e.stopPropagation());

  popup.querySelectorAll('button').forEach((pbtn) => {
    pbtn.addEventListener('click', (e) => {
      e.stopPropagation();
      const scope = pbtn.dataset.scope;
      const thumbType = popup.dataset.pendingThumb;
      state.thumb = thumbType; state.scope = scope;
      refreshFeedbackIcon(index);
      popup.style.display = 'none';
      const label = scope === 'source' ? 'Quelle' : scope === 'topic' ? 'Thema' : 'Quelle & Thema';
      showFbToast('fbToast', 'fbToastText', 'Feedback zu ' + label + ' gespeichert');
      logFeedback({ timestamp: new Date().toISOString(), type: 'thumb', articleId: art.id, category: art.category, source: art.source, bezug: bezugLabel(scope), richtung: richtungLabel(thumbType) }, { toastId: 'fbToast', textId: 'fbToastText' });
    });
  });

  commentBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    const isOpen = panel.style.display === 'block';
    panel.style.display = isOpen ? 'none' : 'block';
    if (!isOpen) input.focus();
  });

  sendBtn.addEventListener('click', () => {
    if (input.value.trim()) {
      state.commentGiven = true;
      refreshFeedbackIcon(index);
      showFbToast('fbToast', 'fbToastText', 'Danke — Kommentar gespeichert');
      logFeedback({ timestamp: new Date().toISOString(), type: 'freitext', articleId: art.id, category: art.category, source: art.source, kommentar: input.value.trim() }, { toastId: 'fbToast', textId: 'fbToastText' });
      input.value = '';
      panel.style.display = 'none';
    }
  });
}

/* Karte (je Karte fest verankerte IDs, einmalig beim Aufbau des Feeds gebunden) */
function attachCardFeedback(index) {
  const art = articles[index];
  if (!feedbackState[art.id]) feedbackState[art.id] = { thumb: null, scope: null, commentGiven: false };
  const state = feedbackState[art.id];
  const up = document.getElementById('fbUp-c' + index);
  const down = document.getElementById('fbDown-c' + index);
  const commentBtn = document.getElementById('fbComment-c' + index);
  const popup = document.getElementById('fbScopePopup-c' + index);
  const cluster = document.getElementById('feedbackCluster-c' + index);

  cluster.addEventListener('pointerdown', (e) => e.stopPropagation());
  cluster.addEventListener('click', (e) => e.stopPropagation());
  popup.addEventListener('pointerdown', (e) => e.stopPropagation());
  popup.addEventListener('click', (e) => e.stopPropagation());

  let pressTimer = null, longPressed = false;

  function startPress(thumbType) {
    longPressed = false;
    pressTimer = setTimeout(() => { longPressed = true; openScopePopup(thumbType); }, 450);
  }
  function endPress(thumbType) {
    clearTimeout(pressTimer);
    if (longPressed) return;
    if (state.thumb === thumbType) { state.thumb = null; state.scope = null; }
    else {
      state.thumb = thumbType; state.scope = 'both';
      showFbToast('fbToast-c' + index, 'fbToastText-c' + index, 'Feedback gespeichert · Quelle & Thema');
      logFeedback({ timestamp: new Date().toISOString(), type: 'thumb', articleId: art.id, category: art.category, source: art.source, bezug: 'beides', richtung: richtungLabel(thumbType) }, { toastId: 'fbToast-c' + index, textId: 'fbToastText-c' + index });
    }
    refreshFeedbackIcon(index);
  }
  function openScopePopup(thumbType) {
    const btn = thumbType === 'up' ? up : down;
    const cardRect = cluster.closest('.card').getBoundingClientRect();
    const btnRect = btn.getBoundingClientRect();
    popup.style.display = 'flex';
    popup.dataset.pendingThumb = thumbType;
    popup.style.right = 'auto';
    popup.style.left = (btnRect.left - cardRect.left) + 'px';
    popup.style.bottom = (cardRect.bottom - btnRect.top + 8) + 'px';
  }

  up.addEventListener('pointerdown', () => startPress('up'));
  up.addEventListener('pointerup', () => endPress('up'));
  up.addEventListener('pointerleave', () => clearTimeout(pressTimer));
  down.addEventListener('pointerdown', () => startPress('down'));
  down.addEventListener('pointerup', () => endPress('down'));
  down.addEventListener('pointerleave', () => clearTimeout(pressTimer));

  popup.querySelectorAll('button').forEach((pbtn) => {
    pbtn.addEventListener('click', () => {
      const scope = pbtn.dataset.scope;
      const thumbType = popup.dataset.pendingThumb;
      state.thumb = thumbType; state.scope = scope;
      refreshFeedbackIcon(index);
      popup.style.display = 'none';
      const label = scope === 'source' ? 'Quelle' : scope === 'topic' ? 'Thema' : 'Quelle & Thema';
      showFbToast('fbToast-c' + index, 'fbToastText-c' + index, 'Feedback zu ' + label + ' gespeichert');
      logFeedback({ timestamp: new Date().toISOString(), type: 'thumb', articleId: art.id, category: art.category, source: art.source, bezug: bezugLabel(scope), richtung: richtungLabel(thumbType) }, { toastId: 'fbToast-c' + index, textId: 'fbToastText-c' + index });
    });
  });

  // Kommentar aus der Karte: springt ins Sheet und öffnet dort direkt das Textfeld
  commentBtn.addEventListener('click', () => openSheetWithComment(index));

  refreshFeedbackIcon(index);
}

function openSheetWithComment(index) {
  openSheet(index);
  setTimeout(() => {
    const panel = document.getElementById('fbCommentPanel');
    const input = document.getElementById('fbCommentInput');
    if (panel) panel.style.display = 'block';
    if (input) input.focus();
  }, 350); // wartet den Sheet-Aufschwung ab
}

function getCategoryIcon(catName) {
  const found = overviewCategories.find(c => c.name === catName);
  return found ? found.icon : overviewCategories[0].icon; // Fallback: Welt-Globus
}


function showOvToast(msg) {
  const toast = document.getElementById('ovToast');
  const text = document.getElementById('ovToastText');
  text.textContent = msg;
  toast.style.opacity = '1';
  clearTimeout(toast._t);
  toast._t = setTimeout(() => { toast.style.opacity = '0'; }, 1800);
}

function openOverview() {
  document.getElementById('overviewOverlay').classList.remove('hidden');
}
function closeOverview() {
  document.getElementById('overviewOverlay').classList.add('hidden');
}

function firstImageForCategory(catName) {
  const match = allArticles.find(a => a.category === catName && a.image);
  return match ? match.image : null;
}

function buildOverviewGrid() {
  const grid = document.getElementById('categoryGrid');
  grid.innerHTML = '';
  overviewCategories.forEach((c) => {
    const tile = document.createElement('div');
    tile.className = 'ov-category-tile';
    const img = firstImageForCategory(c.name);
    let gradientDiv = '';
    if (img) {
      tile.classList.add('has-img');
      tile.style.backgroundImage = `url(${img})`;
      gradientDiv = '<div class="tile-gradient"></div>';
    }
    tile.innerHTML = `
      ${gradientDiv}
      <div class="icon-badge"><svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">${c.icon}</svg></div>
      <div class="cat-name">${c.name}</div>`;
    tile.addEventListener('click', () => openFeed(c.name));
    grid.appendChild(tile);
  });
  const newsFeedHero = document.getElementById('ovHeroNewsFeed');
  if (allArticles[0] && allArticles[0].image) {
    newsFeedHero.classList.add('has-img');
    newsFeedHero.style.backgroundImage = `url(${allArticles[0].image})`;
    newsFeedHero.insertAdjacentHTML('afterbegin', '<div class="tile-gradient"></div>');
  }
}
